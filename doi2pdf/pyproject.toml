[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doi2pdf"
version = "0.1.0"
description = "Resolve DOIs and download PDFs with publisher-specific automation via Selenium"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tan Zheng", email = "zhengtan@connect.hku.hk"}
]
requires-python = ">=3.8"
dependencies = [
    "selenium>=4.8.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
webdriver = ["webdriver-manager>=4.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/doi2pdf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doi2proxy"
version = "0.1.0"
description = "Convert DOI to HKU EZproxy URLs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tan Zheng", email = "zhengtan@connect.hku.hk"}
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
doi2proxy = "doi2proxy:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
